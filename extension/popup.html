<!doctype html>
<html lang="zh">
  <head>
    <meta charset="utf-8" />
    <title>MuxShift</title>
    <style>
      :root {
        color-scheme: dark;
      }
      body {
        margin: 0;
        padding: 12px;
        width: 340px;
        font: 13px/1.45 system-ui, sans-serif;
        background: #16181c;
        color: #e6e8ec;
      }
      h1 {
        font-size: 14px;
        margin: 0 0 2px;
      }
      .page {
        color: #9aa0aa;
        word-break: break-all;
        margin-bottom: 10px;
      }
      ul {
        list-style: none;
        margin: 0 0 10px;
        padding: 0;
      }
      li {
        border: 1px solid #2a2e36;
        border-radius: 6px;
        padding: 8px;
        margin-bottom: 6px;
      }
      li.selected {
        border-color: #4c7dd8;
        background: #1b2130;
      }
      .kind {
        color: #8fb3ff;
        font-size: 11px;
        text-transform: uppercase;
        letter-spacing: 0.04em;
      }
      .url {
        word-break: break-all;
        font-family: ui-monospace, monospace;
        font-size: 11px;
        margin-top: 2px;
      }
      .from {
        color: #7d838d;
        font-size: 11px;
      }
      .note {
        color: #c9a227;
        font-size: 11px;
        margin: 4px 0;
      }
      button {
        width: 100%;
        padding: 8px;
        border-radius: 6px;
        border: 1px solid #3a4150;
        background: #232833;
        color: #e6e8ec;
        cursor: pointer;
      }
      button:disabled {
        opacity: 0.5;
        cursor: default;
      }
      #resolve {
        margin-bottom: 6px;
        border-color: #4c7dd8;
      }
      #status {
        margin-top: 8px;
        min-height: 18px;
        font-size: 12px;
      }
      #status.ok {
        color: #5fbf7f;
      }
      #status.bad {
        color: #e06c6c;
      }
      .meta {
        color: #7d838d;
        font-size: 11px;
        margin-top: 8px;
      }
      .pair-row {
        display: flex;
        gap: 6px;
        margin-bottom: 8px;
      }
      .pair-row input {
        flex: 1;
        padding: 6px;
        border-radius: 6px;
        border: 1px solid #3a4150;
        background: #1b1f27;
        color: #e6e8ec;
        font: 13px ui-monospace, monospace;
      }
      .pair-row button {
        width: 74px;
      }
      .pair-line {
        color: #7d838d;
        font-size: 11px;
        margin-bottom: 8px;
        word-break: break-all;
      }
      .advanced {
        margin-top: 12px;
        border-top: 1px solid #2a2e36;
        padding-top: 8px;
      }
      .advanced summary {
        cursor: pointer;
        color: #9aa0aa;
        font-size: 12px;
        user-select: none;
      }
      .advanced[open] summary {
        margin-bottom: 8px;
      }
      .advanced #import {
        margin-top: 2px;
      }
    </style>
  </head>
  <body>
    <h1>MuxShift</h1>
    <div class="pair-row">
      <input id="code" inputmode="numeric" maxlength="6" placeholder="配对码" />
      <button id="pair">配对</button>
    </div>
    <div class="pair-line" id="pair-line">正在检查本机窗口…</div>
    <div class="page" id="page">正在读取当前标签页…</div>
    <button id="resolve" hidden>解析并发送</button>
    <div id="status"></div>
    <details class="advanced" id="advanced">
      <summary id="advanced-title">高级</summary>
      <div class="meta" id="advanced-meta"></div>
      <ul id="sources"></ul>
      <button id="import" disabled>导入所选地址</button>
    </details>
    <script src="popup.js"></script>
  </body>
</html>
