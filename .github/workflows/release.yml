name: release

# Publishes the files for a tag that already exists. Cutting the tag is a
# different action (tag.yml); this one never creates or moves a tag, so shipping
# a build and naming the commit it came from stay separate, auditable steps.
on:
  workflow_dispatch:
    inputs:
      version:
        description: Version to publish, matching the tag and VERSION (for example 0.0.1)
        required: true
        type: string

permissions:
  contents: write
  actions: read

concurrency:
  group: release-${{ inputs.version }}
  cancel-in-progress: false

jobs:
  build:
    name: build and draft the release
    runs-on: windows-latest
    steps:
      - name: Check the tag before checking it out
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ inputs.version }}
        shell: bash
        run: |
          set -euo pipefail
          if ! printf '%s' "$VERSION" | grep -Eq '^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$'; then
            echo "::error::the version must be x.y.z"
            exit 1
          fi
          if ! git ls-remote --tags --exit-code origin "refs/tags/v$VERSION" >/dev/null; then
            echo "::error::tag v$VERSION does not exist; cut it with the tag action first"
            exit 1
          fi
      - uses: actions/checkout@v4
        with:
          ref: refs/tags/v${{ inputs.version }}
          fetch-depth: 0
      - name: Check VERSION agrees with the tag
        shell: bash
        env:
          VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          file_version="$(tr -d ' \r\n' < VERSION)"
          if [ "$file_version" != "$VERSION" ]; then
            echo "::error::VERSION says $file_version but the tag is v$VERSION"
            exit 1
          fi
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache-dependency-path: |
            go.sum
            desktop/go.sum
      - name: Build the release archive
        shell: pwsh
        run: ./scripts/release.ps1
      - name: Verify the archive and the binary
        shell: pwsh
        env:
          VERSION: ${{ inputs.version }}
        run: |
          $tree = (git status --porcelain).Length
          if ($tree -ne 0) { throw "the tree is dirty after building the release" }
          ./scripts/verify-release.ps1 -Ref "v$env:VERSION"
      - name: Extract the release notes
        shell: pwsh
        env:
          VERSION: ${{ inputs.version }}
        run: ./scripts/release-notes.ps1 -Tag "v$env:VERSION" -Out release-notes.md
      - name: Draft the release
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ inputs.version }}
        run: |
          $dir = "dist/muxshift-$env:VERSION-windows-amd64"
          if (-not (Test-Path $dir)) { throw "$dir was not built" }
          gh release create "v$env:VERSION" `
            --draft `
            --title "MuxShift v$env:VERSION" `
            --notes-file release-notes.md `
            "$dir.zip" "$dir/VERSION.txt"
      - uses: actions/upload-artifact@v4
        with:
          name: muxshift-${{ inputs.version }}-windows-amd64
          path: |
            dist/*.zip
            dist/muxshift-*/VERSION.txt
          if-no-files-found: error
